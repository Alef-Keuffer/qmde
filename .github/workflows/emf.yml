# Builds every EMF bundle, runs the chain on every instance and runs the generated scripts (emf/build.sh).
name: emf

on:
  push:
    branches: [main] # other branches are covered by their pull request
    paths: ['emf/**', '.github/workflows/emf.yml']
  pull_request:
    paths: ['emf/**', '.github/workflows/emf.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Qiskit Aer has no wheels for newer Pythons; build.sh calls python3.12 by name.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: emf/requirements.txt
      # Tycho downloads the target platform (emf/releng/emf.target) into ~/.m2.
      - uses: actions/cache@v6
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('emf/**/pom.xml', 'emf/releng/emf.target', 'emf/.mvn/**') }}
          restore-keys: m2-
      - run: ./build.sh
      # Every run's results, for the tables of docs/report_2 and CONTEXT.md (docs/report_2/build.sh fetches them).
      - uses: actions/upload-artifact@v7
        with:
          name: emf-results
          path: emf/out/*/results_*.json
          if-no-files-found: error
      # build.sh created .venv with requirements.txt; the tools' tests need only the standard library.
      - run: .venv/bin/python -m unittest discover -s python && python3 -m unittest discover -s tools
